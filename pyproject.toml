# -*- coding: utf-8 -*-
# 工程化护栏配置（T28）：ruff 只开「能抓真问题」的规则集
#   F  = Pyflakes（未用 import/变量、未定义名）
#   E9 = 语法级错误（空 except 之外的严重问题）
#   B  = flake8-bugbear（可变默认参数、循环内闭包捕获等常见坑）
# 运行：ruff check .      （CI 见 .github/workflows/daily-update.yml）
[tool.ruff]
line-length = 140          # 与现有代码风格一致（多为长单行）
target-version = "py312"
exclude = ["scripts/_archive", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = [
    "E501",   # 行宽交由 line-length 之外的既有风格决定（存量长行较多）
    "B008",   # 函数调用作为默认值（本仓库无此用法，但保留容错）
]

[tool.ruff.lint.per-file-ignores]
"_test_analysis.py" = ["E402"]   # 测试脚本按段落 import，允许非顶部导入
"update.py" = ["E402"]           # 入口脚本先包装 stdout 再 import 子模块
